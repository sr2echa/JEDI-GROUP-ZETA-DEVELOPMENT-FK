@startuml
skinparam ActivityDiamondBackgroundColor #fdfd96
skinparam ActivityBackgroundColor #f0f8ff
skinparam ActivityBorderColor #0047ab
skinparam defaultFontName Arial
skinparam ArrowColor #2c3e50

title FlipFit - Gym Owner


|Gym Owner|
start
:Access Center Management Dashboard;
if (Authentication Successful?) then (yes)
  :Select Managed Center;
  split
    :Update Existing Slot Timings;
  split again
    :Modify Seat Capacity for Specific Slots;
  split again
    :Add/Remove Slots for Particular Days;
  end split
  :Save Updates to Database;
  stop
else (no)
  :Display Access Denied;
  stop
endif
@enduml

